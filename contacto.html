<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-SgOJa3DmI69IUzQ2PVdRZhwQ+dy64/BUtbMJw1MZ8t5HZApcHrRKUc4W0kG879m7" crossorigin="anonymous">" 
    <link rel="stylesheet" href="style.css">
    <title>Portafolio</title>
    
</head>
<body class="fondoContacto">
    <header class="d-flex flex-wrap justify-content-center py-3 mb-4 border-bottom">
        <a href="/" class="d-flex align-items-center mb-3 mb-md-0 me-md-auto link-body-emphasis text-decoration-none">
          <svg class="bi me-2" width="40" height="32" aria-hidden="true"><use xlink:href="#bootstrap"></use></svg>
          <span class="fs-4 enzo">Enzo Robles</span>
        </a>
    
        <ul class="nav nav-pills">
          <li class="nav-item"><a href="index.html" class="nav-link active" aria-current="page">Inicio</a></li>
          <li class="nav-item"><a href="sobremi.html  " class="nav-link">Sobre mi</a></li>
          <li class="nav-item"><a href="portafolio.html" class="nav-link">Proyectos</a></li>
          <li class="nav-item"><a href="contacto.html" class="nav-link">Contacto</a></li>
        </ul>
    </header>

    <div class="container">
        <div class="row align-items-center">
            <div class="col">

                <div class="formulario">
                    <div class="container text-center">

                    <form style="width: 26rem;">
                        <!-- Name input -->
                        <div data-mdb-input-init class="form-outline mb-4">
                        <input type="text" id="form4Example1" class="form-control" />
                        <label class="form-label" for="form4Example1">Nombre</label>
                        </div>
                    
                        <!-- Email input -->
                        <div data-mdb-input-init class="form-outline mb-4">
                        <input type="email" id="form4Example2" class="form-control" />
                        <label class="form-label" for="form4Example2">Ingresar gmail</label>
                        </div>
                    
                        <!-- Message input -->
                        <div data-mdb-input-init class="form-outline mb-4">
                        <textarea class="form-control" id="form4Example3" rows="4"></textarea>
                        <label class="form-label" for="form4Example3">Mensaje</label>
                        </div>
                    
                        <!-- Checkbox -->
                        <div class="form-check d-flex justify-content-center mb-4">
                        <input
                            class="form-check-input me-2"
                            type="checkbox"
                            value=""
                            id="form4Example4"
                            checked
                        />
                        <label class="form-check-label" for="form4Example4">
                            Envíame una copia de este mensaje
                        </label>
                        </div>
                    
                        <!-- Submit button -->
                        <button data-mdb-ripple-init type="button" class="btn btn-primary btn-block mb-4">
                            Enviar</button>
                    </form>
                </div>
            </div>
        </div>

        <div class="col">
            <div class="contacto">
                <img src="images.jpg" width="100px">
                <br>
                <h1>Gmail:</h1>
                <h2>Gatoconcapucha@gmail.com</h2>
                <img src="ig.jpg" width="100px">
                <h3>Instagram:</h3>
                <h4>enzo1234</h4>
            </div>
        </div>
    
    </div>




    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/js/bootstrap.bundle.min.js" integrity="sha384-k6d4wzSIapyDyv1kpU366/PK5hCdSbCRGRCMv+eplOQJWyd1fbcAu9OCUj5zNLiq" crossorigin="anonymous"></script>
</body>
</html>
